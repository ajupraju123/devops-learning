# BROKEN ON PURPOSE: OOMKilled, then CrashLoopBackOff.
# The container tries to use 250M of memory but its limit is 100Mi, so the kernel kills it (SIGKILL, exit 137).
#
# Predict first: what exit code and reason will describe show?
# Diagnose:
#   kubectl get pod oom-demo -w
#   kubectl describe pod oom-demo          # Last State: Terminated, Reason: OOMKilled, Exit Code: 137
#   kubectl get pod oom-demo -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason}{"\n"}'
# Fix: raise the memory limit above what the app needs (e.g. 300Mi), or fix the memory use.
#
# Note: if this image can't be pulled in your playground, any image that allocates memory will do.
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  labels:
    app: oom-demo
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 100Mi
