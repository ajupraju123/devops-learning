# BROKEN ON PURPOSE: the Service HAS endpoints, but requests fail.
# nginx listens on port 80, but the Service forwards to targetPort 8080, where nothing is listening.
#
# Predict first: will `describe svc` show endpoints? How is this different from a selector mismatch?
# Diagnose:
#   kubectl describe svc tp-demo          # Endpoints: <pod-ip>:8080  (endpoints exist, port is wrong)
#   kubectl get endpointslices
#   kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- curl -sv --max-time 3 http://tp-demo
#                                         # connection refused or timeout
#   kubectl describe pod tp-demo          # container ports / what the app actually listens on
# Fix: set targetPort: 80 in the Service.
apiVersion: v1
kind: Pod
metadata:
  name: tp-demo
  labels:
    app: tp-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tp-demo
spec:
  selector:
    app: tp-demo
  ports:
    - port: 80
      targetPort: 8080     # wrong: the container listens on 80
