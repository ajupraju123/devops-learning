# BROKEN ON PURPOSE: CrashLoopBackOff.
# The image pulls fine and the container starts, then exits with code 1. The kubelet keeps restarting it
# with an exponentially increasing delay (10s, 20s, 40s... up to 5 minutes). That delay is the "BackOff".
#
# Predict first: will `kubectl exec` be useful here? Which command shows why it died?
# Diagnose:
#   kubectl get pod crash-demo -w         # watch RESTARTS climb
#   kubectl describe pod crash-demo       # Last State: Terminated, Exit Code: 1
#   kubectl logs crash-demo --previous    # the output of the crashed container
# Fix: in real life, correct the config or env var the app needs. Here, change the command so it stays running.
apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  labels:
    app: crash-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo starting up; echo 'ERROR: DATABASE_URL is not set' >&2; exit 1"]
